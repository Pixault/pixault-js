name: Publish to npm

# Publishes @pixault/sdk to npmjs.com via trusted publishing (OIDC) -- the same
# model the .NET SDKs use, so no long-lived registry token is stored anywhere.
#
# Trigger: push a version tag (v1.2.3 or v1.2.3-beta.1). package.json remains the
# source of truth for the version; the tag must agree with it, and the job fails
# loudly if they drift rather than publishing something nobody asked for.
#
# ONE-TIME SETUP on npmjs.com: Package settings -> Trusted publisher -> GitHub
# Actions, repository Pixault/pixault-js, workflow publish.yml. Until that exists
# the publish step fails with an auth error; nothing else here needs changing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1+; the bundled npm may be older.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Verify tag matches package.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing version $PKG"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Guard against shipping an empty package: dist/ is gitignored, so if the
      # build silently produced nothing, publish would upload a manifest and no code.
      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/index.js dist/index.cjs dist/index.d.ts; do
            [ -s "$f" ] || { echo "::error::missing or empty $f"; exit 1; }
          done
          npm pack --dry-run

      - name: Publish
        run: npm publish --access public
